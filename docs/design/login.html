<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login — Audicon</title>
  <link rel="stylesheet" href="css/tokens.css">
  <style>
    body {
      min-height: 100vh;
      background: var(--brand-navy);
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
    }
    body::before {
      content: '';
      position: absolute;
      inset: 0;
      background: radial-gradient(ellipse at 60% 30%, rgba(37,99,235,0.18) 0%, transparent 60%);
      pointer-events: none;
    }
    .login-wrap {
      width: 100%;
      max-width: 380px;
      position: relative;
    }
    .login-brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 28px;
      justify-content: center;
    }
    .login-mark {
      width: 36px; height: 36px;
      background: var(--accent);
      border-radius: 8px;
      display: flex; align-items: center; justify-content: center;
    }
    .login-name {
      font-size: 22px;
      font-weight: 700;
      color: white;
      letter-spacing: -0.02em;
    }
    .login-card {
      background: white;
      border-radius: 12px;
      padding: 36px 32px;
      box-shadow: 0 20px 40px rgba(0,0,0,0.25);
    }
    .login-card h1 {
      font-size: 20px;
      font-weight: 600;
      color: var(--fg);
      letter-spacing: -0.01em;
      margin-bottom: 4px;
    }
    .login-sub {
      font-size: 13px;
      color: var(--muted);
      margin-bottom: 24px;
    }
    .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
    .label { font-size: 13px; font-weight: 500; color: var(--fg); }
    .input-wrap { position: relative; }
    .input {
      width: 100%; padding: 9px 12px;
      border: 1px solid var(--border);
      border-radius: var(--radius);
      background: white; color: var(--fg);
      font-size: 13.5px; font-family: var(--font);
      outline: none; transition: border-color .12s, box-shadow .12s;
    }
    .input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px rgba(37,99,235,0.1); }
    .input::placeholder { color: var(--subtle); }
    .input-pw { padding-right: 38px; }
    .pw-toggle {
      position: absolute; right: 10px; top: 50%; transform: translateY(-50%);
      background: none; border: none; cursor: pointer; color: var(--subtle);
      padding: 3px; display: flex; align-items: center; border-radius: 4px;
      transition: color .12s;
    }
    .pw-toggle:hover { color: var(--fg); }
    .forgot {
      display: block; text-align: right; font-size: 12.5px;
      color: var(--accent); text-decoration: none; margin-top: -6px; margin-bottom: 20px;
    }
    .forgot:hover { text-decoration: underline; }
    .alert-error {
      background: var(--danger-muted); border: 1px solid #fecaca;
      border-radius: var(--radius); padding: 10px 13px;
      font-size: 12.5px; color: #7f1d1d;
      display: none; margin-bottom: 14px;
    }
    .alert-error.show { display: flex; gap: 8px; align-items: flex-start; }
    .btn-submit {
      width: 100%; padding: 10px; background: var(--accent); color: white;
      border: none; border-radius: var(--radius); font-size: 14px; font-weight: 600;
      font-family: var(--font); cursor: pointer; transition: background .12s;
      display: flex; align-items: center; justify-content: center; gap: 8px;
    }
    .btn-submit:hover:not(:disabled) { background: var(--accent-hover); }
    .btn-submit:disabled { opacity: .65; cursor: not-allowed; }
    .login-footer {
      margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border);
      font-size: 11.5px; color: var(--subtle); text-align: center;
    }
    .demo-hint {
      margin-top: 16px; padding: 10px 12px;
      background: var(--accent-muted); border: 1px solid var(--accent-border);
      border-radius: var(--radius); font-size: 12px; color: #1e40af;
    }
    .demo-hint strong { font-weight: 600; display: block; margin-bottom: 4px; }
    .demo-btn {
      background: none; border: 1px solid var(--accent-border); border-radius: 4px;
      padding: 2px 8px; font-size: 11.5px; color: var(--accent); cursor: pointer;
      font-family: var(--font); font-weight: 500; margin: 2px 2px 0 0;
      transition: background .12s;
    }
    .demo-btn:hover { background: white; }
    @keyframes spin { to { transform: rotate(360deg); } }
    .spinner { animation: spin .7s linear infinite; }
    @media (max-width: 480px) { .login-card { padding: 28px 20px; } }
  </style>
</head>
<body>
  <div class="login-wrap">
    <div class="login-brand">
      <div class="login-mark">
        <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
          <path d="M12 2L2 7l10 5 10-5-10-5z"/><path d="M2 17l10 5 10-5"/><path d="M2 12l10 5 10-5"/>
        </svg>
      </div>
      <span class="login-name">Audicon</span>
    </div>

    <div class="login-card">
      <h1>Bem-vindo de volta</h1>
      <p class="login-sub">Acesso restrito a funcionários autorizados.</p>

      <div class="alert-error" id="alert-error">
        <svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="flex-shrink:0;margin-top:1px">
          <circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/>
        </svg>
        E-mail ou senha inválidos. Verifique e tente novamente.
      </div>

      <form id="login-form" novalidate>
        <div class="form-group">
          <label class="label" for="email">E-mail</label>
          <input class="input" type="email" id="email" placeholder="seu@email.com" autocomplete="email" required>
        </div>

        <div class="form-group">
          <label class="label" for="password">Senha</label>
          <div class="input-wrap">
            <input class="input input-pw" type="password" id="password" placeholder="••••••••" autocomplete="current-password" required>
            <button type="button" class="pw-toggle" id="pw-toggle" aria-label="Mostrar senha">
              <svg id="eye-icon" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>
              </svg>
            </button>
          </div>
        </div>

        <a href="#" class="forgot">Esqueceu a senha?</a>

        <button type="submit" class="btn-submit" id="submit-btn">
          <span id="btn-text">Entrar</span>
          <svg id="btn-spin" class="spinner" viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="white" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" style="display:none">
            <path d="M21 12a9 9 0 1 1-6.219-8.56"/>
          </svg>
        </button>
      </form>

      <div class="demo-hint">
        <strong>Demo — clique para preencher:</strong>
        <button class="demo-btn" onclick="fillDemo('gerente')">Gerente</button>
        <button class="demo-btn" onclick="fillDemo('funcionario')">Funcionário</button>
        <button class="demo-btn" onclick="fillDemo('master')">Master</button>
      </div>

      <p class="login-footer">Audicon © 2025 — Gestão de Infrações em Condomínios</p>
    </div>
  </div>

  <script>
    const destinations = {
      master: 'master-companies.html',
      gerente: 'dashboard.html',
      funcionario: 'condominiums.html',
    };

    function fillDemo(role) {
      document.getElementById('email').value = `${role}@audicon.com`;
      document.getElementById('password').value = 'Demo@2025';
      document.getElementById('email').dataset.role = role;
    }

    const pwInput = document.getElementById('password');
    document.getElementById('pw-toggle').addEventListener('click', () => {
      const show = pwInput.type === 'password';
      pwInput.type = show ? 'text' : 'password';
      document.getElementById('eye-icon').innerHTML = show
        ? '<path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/><line x1="1" y1="1" x2="23" y2="23"/>'
        : '<path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/>';
    });

    document.getElementById('login-form').addEventListener('submit', e => {
      e.preventDefault();
      const alert = document.getElementById('alert-error');
      const btn = document.getElementById('submit-btn');
      const spin = document.getElementById('btn-spin');
      const label = document.getElementById('btn-text');
      alert.classList.remove('show');
      btn.disabled = true;
      label.textContent = 'Entrando...';
      spin.style.display = 'inline-block';
      setTimeout(() => {
        const email = document.getElementById('email');
        const role = email.dataset.role || (email.value.includes('master') ? 'master' : email.value.includes('funcionario') ? 'funcionario' : 'gerente');
        window.location.href = destinations[role] || 'dashboard.html';
      }, 1100);
    });
  </script>
</body>
</html>
